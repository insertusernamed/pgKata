function setRC(html) {

// ── PGlite ──────────────────────────────────────────

async function ensureDB() {
    if (pg) return pg
    pg = new PGlite('idb://pgkata')
    return pg
}

function rowsToTable(result) {
    if (!result || !result.rows) return { columns: [], rows: [], row_count: 0 }
    if (result.rows.length === 0) {
        const keys = Object.keys(result.fields || {})
        return { columns: keys, rows: [], row_count: 0 }
    }
    const columns = Object.keys(result.rows[0])
    const rows = result.rows.map(row => columns.map(c => String(row[c] ?? '')))
    return { columns, rows, row_count: rows.length }
}

async function pgExec(sql) {
    const db = await ensureDB()
    try {
        const raw = await db.exec(sql)
        return raw.map(r => {
            if (r.rows) {
                const tbl = rowsToTable(r)
                return { type: 'select', columns: tbl.columns, rows: tbl.rows, row_count: tbl.row_count }
            }
            return { type: 'execute', rows_affected: r.affectedRows ?? null }
        })
    } catch (e) {
        return [{ type: 'error', error: e.message }]
    }
}

async function pgQuery(sql) {
    const db = await ensureDB()
    return db.query(sql)
}

// ── DB status ───────────────────────────────────────

async function initDB() {
    const status = $('db-status')
    status.textContent = 'starting PG…'
    status.className = 'db-status db-loading'
    try {
        const start = performance.now()
        await ensureDB()
        await pg.exec('SELECT 1')
        const elapsed = ((performance.now() - start) / 1000).toFixed(1)
        status.textContent = `PG ready (${elapsed}s)`
        status.className = 'db-status db-ready'
    } catch (e) {
        status.textContent = 'PG failed to start'
        status.className = 'db-status db-error'
    }
}
initDB()

// ── Split pane ──────────────────────────────────────

function initSplitPane() {
    const handle = $('split-handle')
    const results = $('results-section')
    const panel = document.querySelector('.main-panel')

    function loadSplit() {
        try { return parseFloat(localStorage.getItem('sql_split_pct')) || 0.35 } catch(e) { return 0.35 }
    }
    function applySplit(pct) {
        const panelH = panel.clientHeight, handleH = handle.clientHeight
        const resultsH = Math.max(60, Math.round(panelH * pct))
        const editorH = panelH - resultsH - handleH
        const es = document.querySelector('.editor-section')
        if (es) { es.style.flex = 'none'; es.style.height = Math.max(50, editorH) + 'px' }
        results.style.height = resultsH + 'px'; results.style.flex = 'none'
        // ponytail: keep schema-graph position + saved height in sync during resize
        if ($('schema-graph').style.display !== 'none') {
            _savedRsHeight = resultsH + 'px'
            results.style.height = '33px'
            const tabs = document.querySelector('.results-header')
            const top = Math.max(50, editorH) + (handleH || 4) + (tabs?.offsetHeight ?? 33)
            $('schema-graph').style.top = top + 'px'
        }
    }
    function onDown(e) { splitDragging = true; handle.classList.add('active'); e.preventDefault() }
    function onMove(e) {
        if (!splitDragging) return
        const rect = panel.getBoundingClientRect()
        const y = (e.clientY || e.touches[0].clientY) - rect.top
        const pct = Math.max(0.08, Math.min(0.7, (rect.height - y) / rect.height))
        applySplit(pct)
        try { localStorage.setItem('sql_split_pct', pct) } catch(e) {}
    }
    function onUp() { if (!splitDragging) return; splitDragging = false; handle.classList.remove('active') }
    handle.addEventListener('mousedown', onDown)
    document.addEventListener('mousemove', onMove)
    document.addEventListener('mouseup', onUp)
    handle.addEventListener('touchstart', onDown)
    document.addEventListener('touchmove', onMove)
    document.addEventListener('touchend', onUp)
    setTimeout(() => applySplit(loadSplit()), 50)
    window.addEventListener('resize', () => applySplit(loadSplit()))
}
initSplitPane()

// ── Indent prefs ────────────────────────────────────

function loadIndentPref() {
    try { return JSON.parse(localStorage.getItem('sql_indent_pref')) || { size: 1, mode: 'tabs' } }
    catch(e) { return { size: 1, mode: 'tabs' } }
}
function saveIndentPref(pref) {
    try { localStorage.setItem('sql_indent_pref', JSON.stringify(pref)) } catch(e) {}
}
function updateIndentSelector(pref) {
    const sizes = document.getElementById('indent-sizes')
    const sizeOpts = pref.mode === 'tabs' ? [1, 2, 3] : [2, 4, 6]
    sizes.innerHTML = sizeOpts.map(s =>
        `<span class="indent-option${s === pref.size ? ' active' : ''}" data-indent="${s}" onclick="window.setIndentUnit(${s})">${s}</span>`
    ).join('')
    document.querySelectorAll('.indent-option[data-mode]').forEach(el => {
        el.classList.toggle('active', el.dataset.mode === pref.mode)
    })
}

window.setIndentUnit = function(size) {
    const pref = loadIndentPref()
    pref.size = parseInt(size)
    saveIndentPref(pref)
    if (editor) {
        const unit = pref.mode === 'tabs' ? pref.size * 4 : pref.size
        editor.setOption('indentUnit', unit)
        editor.setOption('tabSize', 4)
    }
    updateIndentSelector(pref)
}

window.setIndentMode = function(mode) {
    const pref = loadIndentPref()
    pref.mode = mode
    pref.size = mode === 'tabs' ? 1 : 4
    saveIndentPref(pref)
    if (editor) {
        editor.setOption('indentWithTabs', mode === 'tabs')
        editor.setOption('tabSize', 4)
        editor.setOption('indentUnit', mode === 'tabs' ? 4 : pref.size)
    }
    updateIndentSelector(pref)
}

// ── Editor save / restore ───────────────────────────

function showSaveIndicator(type) {
    const el = $('save-indicator')
    if (!el) return
    el.className = 'save-indicator ' + (type === 'manual' ? 'save-manual' : 'save-auto')
    el.textContent = type === 'manual' ? 'Saved' : 'Auto-saved'
    el.style.opacity = '1'
    setTimeout(() => { el.style.opacity = '0' }, 2000)
}

function saveEditorContent() {
    if (!editor) return
    if (sandboxMode) {
        if (currentScriptIdx >= 0 && sandboxScripts[currentScriptIdx]) {
            sandboxScripts[currentScriptIdx].content = editor.getValue()
            try { localStorage.setItem('pgkata_sandbox', JSON.stringify({scripts:sandboxScripts, currentScript:currentScriptIdx})) } catch(e) {}
        }
        return
    }
    if (!currentFolder) return
    try { localStorage.setItem('sql_editor_' + currentFolder, editor.getValue()) } catch(e) {}
}
function loadEditorContent(folder) {
    try { return localStorage.getItem('sql_editor_' + folder) } catch(e) { return null }
}
function startAutosave() {
    stopAutosave()
    autosaveTimer = setInterval(() => { saveEditorContent(); showSaveIndicator('auto') }, 30000)
}
function stopAutosave() {
    if (autosaveTimer) { clearInterval(autosaveTimer); autosaveTimer = null }
}

// ── Challenge loading ───────────────────────────────

async function loadChallenges() {
    try {
        const r = await fetch('challenges/index.json')
        challengeMeta = await r.json()
    } catch(e) {
        challengeMeta = {}
    }
    const progress = loadProgress()
    const all = buildChallengeList()
    const completed = Object.keys(progress).length
    renderSidebar(all, progress, completed, all.length, TIERS)
}

function buildChallengeList() {
    const list = []
    for (const tier of TIERS) {
        for (const dir of tier.dirs) {
            const id = tier.id + '/' + dir
            const meta = challengeMeta[id] || {}
            list.push({ id, title: meta.title || dir, difficulty: meta.difficulty || 'medium', description: meta.description || '', hints: meta.hints || [] })
        }
    }
    return list
}

function renderSidebar(challenges, progress, completed, total, tiers) {
    const list = $('challenge-list')
    list.innerHTML = ''
    tiers.forEach(tier => {
        const ids = tier.dirs.map(d => tier.id + '/' + d)
        const done = ids.filter(id => progress[id]).length
        const seg = document.createElement('div')
        seg.className = 'tier-section'
        seg.innerHTML = `<div class="tier-header"><span class="tier-label">${tier.label}</span><span class="tier-count">${done}/${tier.dirs.length}</span></div>`
        const inner = document.createElement('div')
        inner.className = 'tier-challenges'
        tier.dirs.forEach(dir => {
            const fullId = tier.id + '/' + dir
            const c = challenges.find(x => x.id === fullId)
            if (!c) return
            const d = progress[c.id] === true
            const diff = c.difficulty || 'medium'
            const colors = {easy: '#a6e22e', medium: '#e6db74', hard: '#ff297b', expert: '#66d9ef'}
            const color = colors[diff] || '#9a957c'
            const div = document.createElement('div')
            div.className = 'challenge-item' + (d ? ' completed' : '')
            div.dataset.folder = c.id
            div.onclick = () => selectChallenge(c.id)
            div.innerHTML = `
                <span class="challenge-status">${d ? '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#a6e22e" stroke-width="1.5"/><path d="M5 8l2 2 4-4" stroke="#a6e22e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#3e3d32" stroke-width="1.5"/></svg>'}</span>
                <span class="challenge-diff"><svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="${color}"/></svg></span>
                <span class="challenge-title">${c.title}</span>
            `
            inner.appendChild(div)
        })
        seg.appendChild(inner)
        list.appendChild(seg)
    })
    updateProgress(completed, total)
}

function updateProgress(completed, total) {
    const pct = total ? Math.round(completed / total * 100) : 0
    $('progress-label').textContent = `${completed} / ${total}`
    $('progress-fill').style.width = pct + '%'
}

// ── Progress ────────────────────────────────────────

function loadProgress() {
    try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}') } catch(e) { return {} }
}
function saveProgress(data) {
    try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(data)) } catch(e) {}
}
async function markComplete(folder) {
    const data = loadProgress()
    data[folder] = true
    saveProgress(data)
    loadChallenges()
}

// ── Select challenge ────────────────────────────────

async function selectChallenge(folder) {
    saveEditorContent()
    stopAutosave()
    document.querySelectorAll('.challenge-item').forEach(el => {
        el.classList.toggle('active', el.dataset.folder === folder)
    })
    const prev = currentFolder
    currentFolder = folder
    try { localStorage.setItem('pgkata_current', folder) } catch(e) {}
    $('run-btn').disabled = false
    $('verify-btn').disabled = false
    $('hint-btn').disabled = false
    hintLevel = 0
    $('hint-content').style.display = 'none'
    await loadFolder(folder, prev)
}

function ensureEditor() {
    if (editor) return
    const ta = $('editor'); ta.style.display = 'none'
    const p = loadIndentPref()
    editor = CodeMirror.fromTextArea(ta, {
        mode:'text/x-pgsql', theme:'monokai', lineNumbers:true,
        indentWithTabs:p.mode==='tabs', tabSize:4, smartIndent:true, lineWrapping:true, autoCloseBrackets:true,
        indentUnit:p.mode==='tabs'?p.size*4:p.size,
        extraKeys:{
            'Ctrl-Enter':()=>window.runSQL(), 'Cmd-Enter':()=>window.runSQL(),
            'Ctrl-S':()=>{saveEditorContent();showSaveIndicator('manual')},
            'Cmd-S':()=>{saveEditorContent();showSaveIndicator('manual')},
            'Shift-Alt-Down':cm=>duplicateLine(cm),
            'Cmd-Shift-D':cm=>duplicateLine(cm),
            Enter(cm) {
                const c=cm.getCursor(),l=cm.getLine(c.line),ch=c.ch
                if(ch>0&&ch<l.length){const b=l[ch-1],a=l[ch]
                if((b=='{'&&a=='}')||(b=='('&&a==')')){
                const i=/^\s*/.exec(l)[0],u=cm.getOption('indentUnit'),t=cm.getOption('indentWithTabs')?'\t':' ',n=i+t.repeat(u>0?1:u)
                cm.replaceRange('\n'+n+'\n'+i,c);cm.setCursor(c.line+1,n.length);return}}
                return CodeMirror.Pass
            }
        },
        hintOptions:{completeSingle:false}
    })
    editor.on('inputRead',(cm,c)=>{if(c.text.length===1&&/\w/.test(c.text[0])&&!cm.state.completionActive)cm.showHint({hint:CodeMirror.hint.sql,tables:schemaTables,completeSingle:false})})
    editor.on('changes',()=>startAutosave())
    updateIndentSelector(p)
}

async function loadFolder(folder, prev) {
    ensureEditor()
    const meta = challengeMeta[folder] || {}
    const label = folder
    $('file-label').textContent = label
    const desc = meta.description || ''
    $('challenge-desc').textContent = desc
    $('challenge-desc').style.display = desc ? 'block' : 'none'
    $('empty-state').style.display = 'none'
    const saved = loadEditorContent(folder)
    editor.setValue(saved || '-- Write your SQL here\n')
    if (!saved) { setTimeout(() => editor.execCommand('selectAll'), 50) }
    editor.refresh()
    startAutosave()
    $('hint-content').style.display = 'none'
    $('hint-content').innerHTML = ''
    setRC()
    $('verify-result').style.display = 'none'
    await switchChallenge(folder, prev)
}

const SNAP_PREFIX = 'pgkata_snap_'
const SNAP_VERSION = 'pgkata_snap_v2'

const storedVersion = localStorage.getItem('pgkata_snap_version')
if (storedVersion !== SNAP_VERSION) {
    Object.keys(localStorage).filter(k => k.startsWith(SNAP_PREFIX)).forEach(k => localStorage.removeItem(k))
    localStorage.setItem('pgkata_snap_version', SNAP_VERSION)
}

// ponytail: sandbox snap version, bump to invalidate old sandbox snapshots
const SANDBOX_SNAP_VER = 'pgkata_sandbox_snap_v2'
if (localStorage.getItem('pgkata_sandbox_snap_ver') !== SANDBOX_SNAP_VER) {
    localStorage.removeItem(SNAP_PREFIX + '__sandbox__')
    localStorage.setItem('pgkata_sandbox_snap_ver', SANDBOX_SNAP_VER)
}

async function switchChallenge(folder, prev) {
    if (prev && prev !== folder) await saveSnapshot(prev)
    const restored = await restoreSnapshot(folder)
    if (!restored) {
        await runSetup(folder)
        saveSnapshot(folder)
    }
    await loadSchema()
}

async function saveSnapshot(folder) {
    // ponytail: each section individually caught so one query failure doesnt kill the save
    const parts = []
    try {
        const typeLines = []
        const enums = await pgQuery("SELECT t.typname, e.enumlabel FROM pg_type t JOIN pg_enum e ON t.oid = e.enumtypid JOIN pg_namespace n ON t.typnamespace = n.oid WHERE n.nspname = 'public' ORDER BY t.typname, e.enumsortorder")
        let lastType = ''
        let vals = []
        for (const row of enums.rows) {
            if (row.typname !== lastType) {
                if (vals.length) typeLines.push(`CREATE TYPE "${lastType}" AS ENUM (${vals.map(v => `'${v.replace(/'/g, "''")}'`).join(', ')});`)
                lastType = row.typname; vals = []
            }
            vals.push(row.enumlabel)
        }
        if (vals.length) typeLines.push(`CREATE TYPE "${lastType}" AS ENUM (${vals.map(v => `'${v.replace(/'/g, "''")}'`).join(', ')});`)
        if (typeLines.length) parts.push(typeLines.join('\n'))
    } catch(e) {}
    try {
        const seqs = await pgQuery("SELECT sequence_name, data_type, start_value, increment FROM information_schema.sequences WHERE sequence_schema = 'public'")
        const seqLines = []
        for (const s of seqs.rows) {
            seqLines.push(`CREATE SEQUENCE IF NOT EXISTS "${s.sequence_name}" AS ${s.data_type} START WITH ${s.start_value} INCREMENT BY ${s.increment};`)
            try {
                const r = await pgQuery(`SELECT last_value FROM "${s.sequence_name}"`)
                if (r.rows.length > 0) seqLines.push(`SELECT setval('"${s.sequence_name}"', ${r.rows[0].last_value}, true);`)
            } catch(e) {}
        }
        if (seqLines.length) parts.push(seqLines.join('\n'))
    } catch(e) {}
    try {
        const tables = await pgQuery("SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE'")
        const tableLines = []
        for (const {table_name} of tables.rows) {
            try {
                const info = await pgQuery(`SELECT column_name, data_type, is_nullable, column_default, character_maximum_length, numeric_precision, numeric_scale, udt_name FROM information_schema.columns WHERE table_schema = 'public' AND table_name = '${table_name.replace(/'/g, "''")}' ORDER BY ordinal_position`)
                const cols = info.rows
                const colDefs = cols.map(c => {
                    let t = c.data_type === 'USER-DEFINED' ? c.udt_name : c.data_type
                    if (t === 'character varying' && c.character_maximum_length) t = `character varying(${c.character_maximum_length})`
                    if (t === 'numeric' && c.numeric_precision != null) t = c.numeric_scale != null ? `numeric(${c.numeric_precision},${c.numeric_scale})` : `numeric(${c.numeric_precision})`
                    let def = `"${c.column_name}" ${t}`
                    if (c.is_nullable === 'NO') def += ' NOT NULL'
                    if (c.column_default) def += ` DEFAULT ${c.column_default}`
                    return def
                }).join(', ')
                tableLines.push(`CREATE TABLE IF NOT EXISTS "${table_name}" (${colDefs});`)
                const data = await pgQuery(`SELECT * FROM "${table_name}"`)
                if (data.rows.length > 0) {
                    const names = cols.map(c => `"${c.column_name}"`).join(', ')
                    for (const row of data.rows) {
                        const vals = cols.map(c => sqlVal(row[c.column_name])).join(', ')
                        tableLines.push(`INSERT INTO "${table_name}" (${names}) VALUES (${vals});`)
                    }
                }
            } catch(e) {}
        }
        if (tableLines.length) parts.push(tableLines.join('\n'))
    } catch(e) {}
    try {
        const cons = await pgQuery(`SELECT con.conname, cls.relname AS t, pg_catalog.pg_get_constraintdef(con.oid) AS def, con.contype FROM pg_catalog.pg_constraint con JOIN pg_catalog.pg_class cls ON con.conrelid=cls.oid JOIN pg_catalog.pg_namespace n ON cls.relnamespace=n.oid WHERE n.nspname='public' AND con.contype IN ('p','u','f') ORDER BY cls.relname, con.conname`)
        const pkLines = [], fkLines = []
        for (const r of cons.rows) {
            const line = `ALTER TABLE "${r.t}" ADD CONSTRAINT "${r.conname}" ${r.def};`
            if (r.contype === 'f') fkLines.push(line)
            else pkLines.push(line)
        }
        const all = pkLines.concat(fkLines)
        if (all.length) parts.push(all.join('\n'))
    } catch(e) {}
    const sql = parts.join('\n')
    localStorage.setItem(SNAP_PREFIX + folder, sql)
}

function sqlVal(v) {
    if (v === null || v === undefined) return 'DEFAULT'
    if (typeof v === 'number') return String(v)
    if (typeof v === 'boolean') return String(v)
    if (typeof v === 'object') return `'${JSON.stringify(v).replace(/'/g, "''")}'`
    return `'${String(v).replace(/'/g, "''")}'`
}

async function restoreSnapshot(folder) {
    const saved = localStorage.getItem(SNAP_PREFIX + folder)
    if (saved) {
        try {
            await pgExec('DROP SCHEMA public CASCADE; CREATE SCHEMA public')
            const result = await pgExec(saved)
            const errors = result.filter(r => r.type === 'error')
            if (errors.length) {
                localStorage.removeItem(SNAP_PREFIX + folder)
                return false
            }
            return true
        } catch(e) { return false }
    }
    return false
}

window.pgSnapshotDebug = function(folder) {
    folder = folder || '__sandbox__'
    const key = SNAP_PREFIX + folder
    const raw = localStorage.getItem(key)
    if (!raw) return console.warn('[pgKata:debug] no snapshot for', folder)
    const lines = raw.split('\n')
    const createCount = lines.filter(l => l.startsWith('CREATE')).length
    const alterCount = lines.filter(l => l.startsWith('ALTER')).length
    const insertCount = lines.filter(l => l.startsWith('INSERT')).length
    console.warn('[pgKata:debug] snapshot for', folder, {
        key, chars: raw.length, lines: lines.length,
        create_table: createCount, alter_constraint: alterCount, insert_rows: insertCount
    })
    console.warn('[pgKata:debug] first 200 chars:', raw.slice(0, 200))
    console.warn('[pgKata:debug] last 200 chars:', raw.slice(-200))
    return { key, raw, summary: { createCount, alterCount, insertCount } }
}

window.pgSnapshotTest = async function() {
    console.warn('[pgKata:test] starting snapshot test')
    try {
        await pgExec('DROP SCHEMA public CASCADE; CREATE SCHEMA public')
        await pgExec('CREATE TABLE pgkata_test (id SERIAL PRIMARY KEY, val INT); INSERT INTO pgkata_test (val) VALUES (42);')
        const tables = await pgQuery("SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
        console.warn('[pgKata:test] tables after create:', tables.rows.map(r => r.table_name))

        await saveSnapshot('__sandbox__')
        const raw = localStorage.getItem(SNAP_PREFIX + '__sandbox__')
        console.warn('[pgKata:test] snapshot saved, length:', raw?.length ?? 0)

        if (raw) {
            await pgExec('DROP SCHEMA public CASCADE; CREATE SCHEMA public')
            const cr = await pgExec(raw)
            const errors = cr.filter(r => r.type === 'error')
            if (errors.length) {
                console.error('[pgKata:test] replay errors:', errors.map(e => e.error))
                return { passed: false, errors: errors.map(e => e.error) }
            }
            const restored = await pgQuery("SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
            console.warn('[pgKata:test] restored tables:', restored.rows.map(r => r.table_name))
            console.warn('[pgKata:test] snapshot test', restored.rows.length > 0 ? 'PASSED' : 'FAILED')
            return { passed: restored.rows.length > 0, tables: restored.rows.map(r => r.table_name) }
        }
        console.error('[pgKata:test] snapshot was NOT saved!')
        return { passed: false, error: 'snapshot not saved' }
    } catch(e) {
        console.error('[pgKata:test] exception:', e.message)
        return { passed: false, error: e.message }
    }
}

async function loadSchema() {
    try {
        const result = await pgQuery(
            "SELECT table_name, column_name FROM information_schema.columns WHERE table_schema = 'public' ORDER BY table_name, ordinal_position"
        )
        const tables = {}
        for (const row of result.rows) {
            if (!tables[row.table_name]) tables[row.table_name] = []
            tables[row.table_name].push(row.column_name)
            tables[row.column_name] = []
        }
        schemaTables = tables
        if (editor) {
            editor.setOption('hintOptions', { tables, completeSingle: false })
        }
        updatePsqlDatalist()
    } catch(e) {
        console.error('loadSchema failed:', e)
    }
}

function updatePsqlDatalist() {
    const list = document.getElementById('psql-commands')
    if (!list) return
    const existing = new Set()
    list.querySelectorAll('option').forEach(o => existing.add(o.value))
    for (const table of Object.keys(schemaTables)) {
        for (const val of [table, '\\d ' + table, '\\d+ ' + table]) {
            if (!existing.has(val)) {
                const opt = document.createElement('option')
                opt.value = val
                list.appendChild(opt)
                existing.add(val)
            }
        }
    }
}

window.checkSchema = function() {
    console.log('schemaTables:', JSON.stringify(schemaTables))
    console.log('hintOptions:', editor && JSON.stringify(editor.options.hintOptions?.tables ? Object.keys(editor.options.hintOptions.tables) : 'not set'))
    return schemaTables
}

window.switchMode = async function(m) {
    if ((m === 'sandbox') === sandboxMode) return
    saveEditorContent()
    stopAutosave()
    if (sandboxMode) {
        try { localStorage.setItem('pgkata_sandbox', JSON.stringify({scripts:sandboxScripts, currentScript:currentScriptIdx})) } catch(e) {}
        await saveSnapshot('__sandbox__')
    } else {
        if (currentFolder) await saveSnapshot(currentFolder)
    }
    sandboxMode = m === 'sandbox'
    try { localStorage.setItem('pgkata_mode', sandboxMode ? 'sandbox' : 'challenge') } catch(e) {}
    updateModeUI()
    if (sandboxMode) {
        await enterSandbox()
    } else {
        currentFolder = null
        const saved = localStorage.getItem('pgkata_current')
        if (saved) selectChallenge(saved)
        else { $('file-label').textContent = 'Select a challenge from the sidebar'; $('empty-state').style.display = ''; $('challenge-desc').style.display = 'none' }

}

async function enterSandbox() {
    currentFolder = null
    try {
        const d = JSON.parse(localStorage.getItem('pgkata_sandbox'))
        if (d && d.scripts && d.scripts.length) {
            sandboxScripts = d.scripts; currentScriptIdx = d.currentScript || 0
        } else { throw 'new' }
    } catch(e) {
        sandboxScripts = [{name:'main.sql', content:''}]; currentScriptIdx = 0
        try { localStorage.setItem('pgkata_sandbox', JSON.stringify({scripts:sandboxScripts, currentScript:0})) } catch(e) {}
    }
    ensureEditor()
    $('run-btn').disabled = false
    const restored = await restoreSnapshot('__sandbox__')
    if (!restored) { await pgExec('DROP SCHEMA public CASCADE; CREATE SCHEMA public'); await saveSnapshot('__sandbox__') }
    // ponytail: load script directly, selectScript's saveEditorContent would overwrite with challenge SQL
    const s = sandboxScripts[currentScriptIdx]
    if (s) {
        $('file-label').textContent = 'sandbox / ' + s.name
        $('challenge-desc').style.display = 'none'
        $('empty-state').style.display = 'none'
        editor.setValue(s.content || '')
        editor.refresh()
        startAutosave()
    }
    loadSchema()
    renderSandboxSidebar()
    loadSchemaBrowser()
}

async function loadSchemaBrowser() {
    const tree = $('schema-tree')
    if (!tree) return
    // ponytail: remember toggled tables for this render cycle
    const expanded = new Set([...tree.querySelectorAll('.schema-table.expanded')].map(el => el.dataset.table))
    try {
        const tr = await pgQuery("SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE' ORDER BY table_name")
        if (!tr.rows.length) { tree.innerHTML = '<div class="schema-empty">No tables yet</div>'; return }
        const [cr, conr] = await Promise.all([
            pgQuery("SELECT table_name, column_name, data_type FROM information_schema.columns WHERE table_schema='public' ORDER BY table_name, ordinal_position"),
            // ponytail: LEFT JOIN matches runPsql pattern proven to work in PGlite
            pgQuery("SELECT con.conname, cls.relname AS table_name, a.attname AS column_name, con.contype FROM pg_catalog.pg_constraint con JOIN pg_catalog.pg_class cls ON con.conrelid=cls.oid JOIN pg_catalog.pg_namespace n ON cls.relnamespace=n.oid LEFT JOIN pg_catalog.pg_attribute a ON a.attrelid=cls.oid AND a.attnum=ANY(con.conkey) WHERE n.nspname='public' AND con.contype IN ('p','f') ORDER BY cls.relname, con.conname, a.attnum").catch(()=>({rows:[]}))
        ])
        const pk={}, fk={}
        if (conr.rows) conr.rows.forEach(r => {
            if (r.contype === 'p') pk[r.table_name+'|'+r.column_name]=true
            else if (r.contype === 'f') fk[r.table_name+'|'+r.column_name]=true
        })
        const cols={}
        if (cr.rows) cr.rows.forEach(r => {if(!cols[r.table_name])cols[r.table_name]=[];cols[r.table_name].push(r)})
        let html = ''
        for (const t of tr.rows) {
            const cs = cols[t.table_name] || []
            const ex = expanded.has(t.table_name) ? ' expanded' : ''
            html += '<div class="schema-table'+ex+'" data-table="'+esc(t.table_name)+'" onclick="this.classList.toggle(\'expanded\')" tabindex="0" role="button" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){this.click();event.preventDefault()}">'
            html += '<span class="schema-expand">&#9654;</span>'+TBL_ICON+'<span>'+esc(t.table_name)+'</span>'
            html += '</div><div class="schema-columns">'
            for (const c of cs) {
                const k = t.table_name+'|'+c.column_name
                html += '<div class="schema-column">'
                if (pk[k]) html += '<span class="schema-col-icon icon-pk">'+PK_ICON+'</span>'
                else if (fk[k]) html += '<span class="schema-col-icon icon-fk">'+FK_ICON+'</span>'
                else html += '<span class="schema-col-icon"></span>'
                html += '<span class="schema-col-name">'+esc(c.column_name)+'</span><span class="schema-col-type">'+esc(c.data_type)+'</span></div>'
            }
            html += '</div>'
        }
        tree.innerHTML = html
    } catch(e) { console.error('schema browser:', e); tree.innerHTML = '<div class="schema-empty">Error loading schema</div>' }
}

window.runSQL = async function() {
    if (!editor) return
    saveEditorContent()
    const folder = currentFolder
    const sql = editor.getValue()
    if (!sql.trim()) return

    const btn = $('run-btn')
    btn.disabled = true
    btn.innerHTML = '<span class="loading-spinner"></span>'
    setRC()
    $('verify-result').style.display = 'none'

    const startTime = performance.now()
    const results = await pgExec(sql)
    const elapsed = ((performance.now() - startTime) / 1000).toFixed(2)
    $('results-time').textContent = `${elapsed}s`

    btn.disabled = false
    btn.textContent = 'Run'

    if (results.length === 0) {
        setRC('<div class="execute-ok">No results</div>')
        switchResultsTab('results')
        return
    }

    const container = $('results-content')

    let hasError = false
    results.forEach(r => {
        if (r.type === 'select') {
            const block = document.createElement('div')
            block.className = 'result-block'
            block.innerHTML = `
                <div class="result-label">SELECT (${r.row_count} rows)</div>
                <table class="result-table">
                    <thead><tr>${r.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
                    <tbody>${r.rows.map(row => `<tr>${row.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
                </table>`
            container.appendChild(block)
        } else if (r.type === 'execute') {
            const block = document.createElement('div')
            block.className = 'result-block'
            const msg = r.rows_affected != null ? `${r.rows_affected} row(s) affected` : 'Query executed successfully'
            block.innerHTML = `<div class="execute-ok">${msg}</div>`
            container.appendChild(block)
        } else if (r.type === 'error') {
            hasError = true
            const block = document.createElement('div')
            block.className = 'result-block'
            block.innerHTML = `<div class="error-msg">${esc(r.error)}</div>`
            container.appendChild(block)
        }
    })

    if (!hasError) {
        loadSchema()
        if (sandboxMode) { loadSchemaBrowser(); await saveSnapshot('__sandbox__') }
        else if (folder) await saveSnapshot(folder)
    }

    switchResultsTab('results')
}

async function verifyChallenge(challengeId, userSql) {
    const db = await ensureDB()

    const p = challengeId
    const ep = 'challenges/' + p + '/expected.json'
    const sp = 'challenges/' + p + '/setup.sql'

    let expected, setupSql = ''

    const expResp = await fetch(ep)
    if (!expResp.ok) return { passed: false, message: `Challenge '${challengeId}' not found` }
    expected = await expResp.json()

    const setupResp = await fetch(sp)
    if (setupResp.ok) setupSql = await setupResp.text()

    const mode = expected.mode || 'query'

    if (mode === 'query') {
        if (setupSql) {
            const sr = await db.exec(setupSql)
            for (const r of sr) {
                if (r.error) return { passed: false, message: 'Setup error: ' + r.error.message }
            }
        }
        const result = await db.query(userSql)
        const actualRows = result.rows.map(r => Object.values(r).map(v => String(v ?? '')))
        const actualCols = result.rows.length > 0 ? Object.keys(result.rows[0]) : []
        return compareResultSets(actualRows, actualCols, expected)
    }

    if (setupSql) {
        const sr = await db.exec(setupSql)
        for (const r of sr) {
            if (r.error) return { passed: false, message: 'Setup error: ' + r.error.message }
        }
    }
    const ur = await db.exec(userSql)
    for (const r of ur) {
        if (r.error) return { passed: false, message: 'SQL error: ' + r.error.message }
    }

    const checks = expected.checks || []
    for (let i = 0; i < checks.length; i++) {
        const chk = checks[i]
        const cr = await db.query(chk.query)
        const actual = cr.rows.map(r => Object.values(r).map(v => String(v ?? '')))
        const exp = chk.expected.map(r => r.map(v => String(v)))
        const a = JSON.stringify(actual), e = JSON.stringify(exp)
        if (a !== e) {
            return { passed: false, message: `Check ${i} failed.\nQuery: ${chk.query}\nExpected: ${JSON.stringify(exp)}\nActual: ${JSON.stringify(actual)}`, expected: exp, actual }
        }
    }
    return { passed: true, message: 'All state checks passed' }
}

function compareResultSets(actualRows, actualCols, expected) {
    const expCols = expected.columns, expRows = expected.rows

    const aLower = actualCols.map(c => c.toLowerCase())
    const eLower = expCols.map(c => c.toLowerCase())
    if (JSON.stringify(aLower) !== JSON.stringify(eLower)) {
        return { passed: false, message: `Column mismatch.\nExpected: ${expCols}\nActual: ${actualCols}`, expected: { columns: expCols, rows: expRows }, actual: { columns: actualCols, rows: actualRows } }
    }

    const sf = row => JSON.stringify(row.map(c => String(c)))
    const aSet = new Set(actualRows.map(sf))
    const eSet = new Set(expRows.map(sf))

    if (aSet.size === eSet.size && [...aSet].every(x => eSet.has(x))) {
        return { passed: true, message: `Passed (${actualRows.length} rows)` }
    }

    const missing = [...eSet].filter(x => !aSet.has(x)).slice(0, 5)
    const extra = [...aSet].filter(x => !eSet.has(x)).slice(0, 5)
    const parts = []
    if (missing.length) parts.push(`Missing ${missing.length} row(s): ${missing.map(JSON.parse).map(r => `[${r}]`).join(', ')}`)
    if (extra.length) parts.push(`Extra ${extra.length} row(s): ${extra.map(JSON.parse).map(r => `[${r}]`).join(', ')}`)
    return { passed: false, message: parts.join('; '), expected: { columns: expCols, rows: [...eSet].map(JSON.parse) }, actual: { columns: actualCols, rows: [...aSet].map(JSON.parse) } }
}

// ── psql commands ───────────────────────────────────

window.runPsql = async function() {
    const input = $('psql-input')
    if (!input) return
    const cmd = input.value.trim()
    if (!cmd) return

    const container = $('results-content')

    if (cmd.startsWith('\\')) {
        const parts = cmd.split(/\s+/)
        const main = parts[0].toLowerCase()

        if (main === '\\?') {
            setRC(`<div class="psql-result-text">${esc(PSQL_HELP)}</div>`); return
        }
        if (main === '\\x') {
            psqlExpanded = !psqlExpanded
            setRC(`<div class="execute-ok">Expanded display is ${psqlExpanded ? 'on' : 'off'}.</div>`); return
        }
        if (main === '\\conninfo') {
            setRC(`<div class="psql-result-text">You are connected to database "pgkata" as user "pglite" via PostgreSQL (WASM) at version ${pg ? '16' : '?'}.</div>`); return
        }

        const tableCmds = {
            '\\l':  ['Databases', `SELECT datname AS name, pg_catalog.pg_get_userbyid(datdba) AS owner, pg_encoding_to_char(encoding) AS encoding, datcollate AS collate, datctype AS ctype FROM pg_catalog.pg_database ORDER BY datname`],
            '\\dn': ['Schemas', `SELECT nspname AS schema_name, pg_catalog.pg_get_userbyid(nspowner) AS owner FROM pg_catalog.pg_namespace ORDER BY nspname`],
            '\\dt': ['Tables', `SELECT schemaname AS schema, tablename AS table_name, tableowner AS owner FROM pg_catalog.pg_tables WHERE schemaname NOT IN ('pg_catalog', 'information_schema') ORDER BY schemaname, tablename`],
            '\\di': ['Indexes', `SELECT schemaname AS schema, indexname AS index_name, tablename AS table_name FROM pg_catalog.pg_indexes WHERE schemaname NOT IN ('pg_catalog', 'information_schema') ORDER BY schemaname, tablename, indexname`],
            '\\dv': ['Views', `SELECT schemaname AS schema, viewname AS view_name, viewowner AS owner FROM pg_catalog.pg_views WHERE schemaname NOT IN ('pg_catalog', 'information_schema') ORDER BY schemaname, viewname`],
            '\\df': ['Functions', `SELECT n.nspname AS schema, p.proname AS name, pg_catalog.pg_get_function_result(p.oid) AS result_type, pg_catalog.pg_get_function_arguments(p.oid) AS arguments FROM pg_catalog.pg_proc p JOIN pg_catalog.pg_namespace n ON p.pronamespace = n.oid WHERE n.nspname NOT IN ('pg_catalog', 'information_schema') AND p.prokind = 'f' ORDER BY n.nspname, p.proname`],
            '\\du': ['Roles', `SELECT rolname AS role_name, rolsuper AS superuser, rolcreatedb AS create_db FROM pg_catalog.pg_roles ORDER BY rolname`],
            '\\ds': ['Sequences', `SELECT sequence_name, data_type, start_value, increment FROM information_schema.sequences WHERE sequence_schema = 'public' ORDER BY sequence_name`],
            '\\dT': ['Data Types', `SELECT t.typname AS name, CASE t.typtype WHEN 'b' THEN 'base' WHEN 'c' THEN 'composite' WHEN 'd' THEN 'domain' WHEN 'e' THEN 'enum' WHEN 'p' THEN 'pseudo' ELSE 'other' END AS type, n.nspname AS schema FROM pg_catalog.pg_type t JOIN pg_catalog.pg_namespace n ON t.typnamespace = n.oid WHERE n.nspname NOT IN ('pg_catalog', 'information_schema') AND t.typtype IN ('e', 'd') ORDER BY n.nspname, t.typname`],
            '\\dx': ['Extensions', `SELECT extname AS name, extversion AS version, n.nspname AS schema FROM pg_catalog.pg_extension e JOIN pg_catalog.pg_namespace n ON e.extnamespace = n.oid ORDER BY extname`],
        }

        const cmdInfo = tableCmds[main]
        if (cmdInfo) return psqlTable(container, cmdInfo[1], cmdInfo[0])

        if ((main === '\\d' || main === '\\d+') && parts.length > 1) {
            const name = parts[parts.length - 1].replace(/'/g, "''")
            const typeResult = await pgQuery(`SELECT relkind FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON c.relnamespace = n.oid WHERE c.relname = '${name}' AND n.nspname NOT IN ('pg_catalog', 'information_schema')`)
            if (typeResult.rows.length > 0) {
                const relkind = typeResult.rows[0].relkind
                setRC()
                if (relkind === 'r' || relkind === 'v' || relkind === 'm' || relkind === 'f' || relkind === 'p') {
                    const r = await tryPsqlQuery(`SELECT column_name AS "Column", data_type AS "Type", CASE WHEN is_nullable = 'YES' THEN 'YES' ELSE 'NO' END AS "Nullable", COALESCE(column_default, '') AS "Default" FROM information_schema.columns WHERE table_schema = 'public' AND table_name = '${name}' ORDER BY ordinal_position`)
                    if (r) renderTable(container, `Table "public.${esc(parts[parts.length - 1])}"`, r.columns, r.rows)
                    const cr = await tryPsqlQuery(`SELECT con.conname AS "Constraint", CASE con.contype WHEN 'p' THEN 'PRIMARY KEY' WHEN 'u' THEN 'UNIQUE' WHEN 'f' THEN 'FOREIGN KEY' WHEN 'c' THEN 'CHECK' ELSE contype::text END AS "Type", array_agg(a.attname ORDER BY array_position(con.conkey, a.attnum)) AS "Columns" FROM pg_catalog.pg_constraint con JOIN pg_catalog.pg_class cls ON con.conrelid = cls.oid JOIN pg_catalog.pg_namespace n ON cls.relnamespace = n.oid LEFT JOIN pg_catalog.pg_attribute a ON a.attrelid = cls.oid AND a.attnum = ANY(con.conkey) WHERE cls.relname = '${name}' AND n.nspname = 'public' GROUP BY con.conname, con.contype ORDER BY con.conname`)
                    if (cr && cr.rows.length > 0) renderTable(container, `Constraints`, cr.columns, cr.rows)
                } else if (relkind === 'S') {
                    const r = await tryPsqlQuery(`SELECT sequence_name, data_type, start_value, increment, minimum_value, maximum_value, cycle_option FROM information_schema.sequences WHERE sequence_schema = 'public' AND sequence_name = '${name}'`)
                    if (r) renderTable(container, `Sequence "public.${esc(parts[parts.length - 1])}"`, r.columns, r.rows)
                } else if (relkind === 'i') {
                    const r = await tryPsqlQuery(`SELECT schemaname AS schema, indexname AS name, tablename AS table, indexdef AS definition FROM pg_catalog.pg_indexes WHERE indexname = '${name}' AND schemaname NOT IN ('pg_catalog', 'information_schema')`)
                    if (r) renderTable(container, `Index "public.${esc(parts[parts.length - 1])}"`, r.columns, r.rows)
                }
                return
            }
            setRC(`<div class="error-msg">Did not find any relation named "${esc(parts[parts.length - 1])}".</div>`); return
        }

        if (main === '\\d' || main === '\\d+') {
            const more = main === '\\d+'
            const q = more
                ? `SELECT n.nspname AS schema, c.relname AS name, CASE c.relkind WHEN 'r' THEN 'table' WHEN 'v' THEN 'view' WHEN 'm' THEN 'materialized view' WHEN 'S' THEN 'sequence' WHEN 'f' THEN 'foreign table' WHEN 'p' THEN 'partitioned table' WHEN 'I' THEN 'index' ELSE c.relkind::text END AS type, pg_catalog.pg_get_userbyid(c.relowner) AS owner, (SELECT COUNT(*) FROM pg_catalog.pg_indexes i WHERE i.schemaname = n.nspname AND i.tablename = c.relname) AS indexes FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON c.relnamespace = n.oid WHERE n.nspname NOT IN ('pg_catalog', 'information_schema') AND c.relkind IN ('r', 'v', 'm', 'S', 'f', 'p') ORDER BY n.nspname, c.relname`
                : `SELECT n.nspname AS schema, c.relname AS name, CASE c.relkind WHEN 'r' THEN 'table' WHEN 'v' THEN 'view' WHEN 'm' THEN 'materialized view' WHEN 'S' THEN 'sequence' WHEN 'f' THEN 'foreign table' WHEN 'p' THEN 'partitioned table' WHEN 'I' THEN 'index' ELSE c.relkind::text END AS type, pg_catalog.pg_get_userbyid(c.relowner) AS owner FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON c.relnamespace = n.oid WHERE n.nspname NOT IN ('pg_catalog', 'information_schema') AND c.relkind IN ('r', 'v', 'm', 'S', 'f', 'p') ORDER BY n.nspname, c.relname`
            return psqlTable(container, q, 'List of relations')
        }

        setRC(`<div class="error-msg">Unknown command: ${esc(main)}. Type \\? for help.</div>`); return
    }

    const result = await pgQuery(cmd)
    const tbl = rowsToTable(result)
    if (tbl.columns.length > 0) {
        setRC()
        renderTable(container, `psql output (${tbl.row_count} rows)`, tbl.columns, tbl.rows)
    } else {
        setRC(`<div class="execute-ok">Command executed</div>`)
    }
}

const PSQL_HELP = `Available psql meta-commands:
    \\l           List databases
    \\dn          List schemas
    \\dt          List tables
    \\d  [name]   Describe relation (table, view, sequence, index...)
    \\d+ [name]   Describe relation with more detail
    \\di          List indexes
    \\dv          List views
    \\ds          List sequences
    \\df          List functions
    \\du          List roles
    \\dT          List data types
    \\dx          List extensions
    \\x           Toggle expanded display
    \\conninfo    Show connection info
    \\?           Show this help
    SQL          Any SQL statement is executed directly`

async function tryPsqlQuery(sql) {
    try {
        const r = await pgQuery(sql)
        return rowsToTable(r)
    } catch(e) { return null }
}

async function psqlTable(container, sql, label) {
    const r = await tryPsqlQuery(sql)
    if (!r || !r.columns.length) {
        setRC(`<div class="execute-ok">No results</div>`); return
    }
    setRC()
    renderTable(container, `${esc(label)} (${r.row_count} rows)`, r.columns, r.rows)
}

function renderTable(container, label, columns, rows) {
    if (psqlExpanded) {
        rows.forEach((row, i) => {
            const rec = document.createElement('div')
            rec.className = 'expanded-record'
            rec.innerHTML = `<div class="expanded-header">-[ RECORD ${i + 1} ]--</div>` +
                row.map((val, j) =>
                    `<div class="expanded-row"><span class="expanded-field">${esc(columns[j])}</span><span class="expanded-val">${esc(val || '')}</span></div>`
                ).join('')
            container.appendChild(rec)
        })
    } else {
        const block = document.createElement('div')
        block.className = 'result-block'
        block.innerHTML = `<div class="result-label">${esc(label)}</div>
            <table class="result-table"><thead><tr>${columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
            <tbody>${rows.map(row => `<tr>${row.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`
        container.appendChild(block)
    }
}

let schemaZoom = 1, schemaPanX = 0, schemaPanY = 0

async function renderSchemaGraph() {
    const container = $('schema-graph')
    if (!container) return
    try {
        const tables = await pgQuery("SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE' ORDER BY table_name")
        if (!tables.rows.length) {
            container.innerHTML = '<div class="schema-graph-empty">No tables yet. Create one to see your schema.</div>'
            return
        }
        const [cr, conr, fkr] = await Promise.all([
            pgQuery("SELECT table_name, column_name, data_type, is_nullable FROM information_schema.columns WHERE table_schema='public' ORDER BY table_name, ordinal_position"),
            pgQuery("SELECT con.conname, cls.relname AS table_name, a.attname AS column_name, con.contype FROM pg_catalog.pg_constraint con JOIN pg_catalog.pg_class cls ON con.conrelid=cls.oid JOIN pg_catalog.pg_namespace n ON cls.relnamespace=n.oid LEFT JOIN pg_catalog.pg_attribute a ON a.attrelid=cls.oid AND a.attnum=ANY(con.conkey) WHERE n.nspname='public' AND con.contype IN ('p','f')").catch(()=>({rows:[]})),
            pgQuery("SELECT DISTINCT kcu.table_name, kcu.column_name, ccu.table_name AS foreign_table_name, ccu.column_name AS foreign_column_name FROM information_schema.table_constraints tc JOIN information_schema.key_column_usage kcu ON tc.constraint_name = kcu.constraint_name AND tc.table_schema = kcu.table_schema JOIN information_schema.constraint_column_usage ccu ON ccu.constraint_name = tc.constraint_name AND ccu.table_schema = tc.table_schema WHERE tc.constraint_type = 'FOREIGN KEY' AND tc.table_schema = 'public'").catch(()=>({rows:[]}))
        ])

        const pk = {}, fk = {}, fkMap = {}
        if (conr.rows) conr.rows.forEach(r => {
            if (!r.column_name) return
            const k = r.table_name + '|' + r.column_name
            if (r.contype === 'p') pk[k] = true
            else if (r.contype === 'f') fk[k] = true
        })
        if (fkr.rows) fkr.rows.forEach(r => {
            const k = r.table_name + '|' + r.column_name
            if (!fkMap[r.table_name]) fkMap[r.table_name] = {}
            fkMap[r.table_name][r.column_name] = { table: r.foreign_table_name, column: r.foreign_column_name }
        })

        const colMap = {}
        if (cr.rows) cr.rows.forEach(r => {
            if (!colMap[r.table_name]) colMap[r.table_name] = []
            colMap[r.table_name].push({
                name: r.column_name, type: r.data_type,
                nullable: r.is_nullable === 'YES',
                isPK: !!pk[r.table_name + '|' + r.column_name],
                isFK: !!fk[r.table_name + '|' + r.column_name],
                ref: fkMap[r.table_name] ? fkMap[r.table_name][r.column_name] : null
            })
        })

        const CARD_W = 220, GAP_X = 60, GAP_Y = 50, PAD = 40
        const tableList = tables.rows.map(t => ({
            name: t.table_name, columns: colMap[t.table_name] || [],
            h: 30 + (colMap[t.table_name] || []).length * 24
        }))
        tableList.sort((a, b) => b.columns.filter(c => c.isFK).length - a.columns.filter(c => c.isFK).length || a.name.localeCompare(b.name))
        const n = tableList.length
        const cols = Math.max(1, Math.min(n, Math.ceil(Math.sqrt(n * 1.2))))
        const rows = Math.ceil(n / cols)
        const rowH = []
        tableList.forEach((t,i) => {
            const c = Math.floor(i / rows), r = i % rows
            rowH[r] = Math.max(rowH[r]||0, t.h)
        })
        const colHeights = Array(cols).fill(0)
        tableList.forEach((t,i) => {
            const c = Math.floor(i / rows), r = i % rows
            t.x = PAD + c * (CARD_W + GAP_X)
            const colY = PAD + (r > 0 ? rowH.slice(0, r).reduce((a, b) => a + b + GAP_Y, 0) : 0)
            t.y = colY
            colHeights[c] = Math.max(colHeights[c], colY + t.h + PAD)
        })
        const totalW = PAD + cols * (CARD_W + GAP_X) + PAD
        const totalH = Math.max(...colHeights)

        let cards = '', lines = ''
        function routePath(x1, y1, x2, y2, edgeIndex, canvasW, tableList) {
            const goForward = x2 > x1 + 20
            if (goForward) {
                const cx = (x1 + x2) / 2
                return 'M'+x1+' '+y1+' C'+cx+' '+y1+', '+cx+' '+y2+', '+x2+' '+y2
            }
            const rail = canvasW - PAD + 20 + edgeIndex * 18
            const R = 6
            const dir = y2 >= y1 ? 1 : -1
            const blocking = tableList.filter(t =>
                t.x < rail &&
                t.x + CARD_W > x2 + 10 &&
                y2 > t.y - 10 &&
                y2 < t.y + t.h + 10
            )
            if (blocking.length === 0) {
                return 'M'+x1+' '+y1+' L'+(rail-R)+' '+y1+' Q'+rail+' '+y1+' '+rail+' '+(y1+dir*R)
                    +' L'+rail+' '+(y2-dir*R)+' Q'+rail+' '+y2+' '+(rail-R)+' '+y2
                    +' L'+x2+' '+y2
            }
            const blocker = blocking[0]
            const clearY = dir > 0 ? blocker.y + blocker.h + 16 : blocker.y - 16
            return 'M'+x1+' '+y1+' L'+(rail-R)+' '+y1+' Q'+rail+' '+y1+' '+rail+' '+(y1+dir*R)
                +' L'+rail+' '+(clearY-dir*R)+' Q'+rail+' '+clearY+' '+(rail-R)+' '+clearY
                +' L'+(x2+R)+' '+clearY+' Q'+x2+' '+clearY+' '+x2+' '+(clearY+dir*R)
                +' L'+x2+' '+y2
        }
        for (const t of tableList) {
            cards += '<div class="schema-graph-card" style="left:'+t.x+'px;top:'+t.y+'px">'
                +'<div class="schema-graph-card-header">'+TBL_ICON+'<span>'+esc(t.name)+'</span></div><div class="schema-graph-card-body">'
            for (const c of t.columns) {
                const badge = c.isPK ? '<span class="schema-graph-col-badge pk">'+PK_ICON+'</span>'
                    : c.isFK ? '<span class="schema-graph-col-badge fk">'+FK_ICON+'</span>'
                    : '<span class="schema-graph-col-badge"></span>'
                cards += '<div class="schema-graph-col">'+badge
                    +'<span class="schema-graph-col-name">'+esc(c.name)+'</span>'
                    +'<span class="schema-graph-col-type">'+esc(c.type)+(c.nullable?'':'<span class="schema-graph-col-notnull">*</span>')+'</span></div>'
            }
            cards += '</div></div>'

            for (const c of t.columns) {
                if (!c.isFK || !c.ref) continue
                const target = tableList.find(tt => tt.name === c.ref.table)
                if (!target) continue
                const si = t.columns.indexOf(c)
                const ti = target.columns.findIndex(tc => tc.name === c.ref.column)
                if (ti === -1) continue
                const x1 = t.x + CARD_W
                const y1 = t.y + 30 + si * 24 + 12
                const endX = target.x > t.x + 20 ? target.x : target.x + CARD_W
                const y2 = target.y + 30 + ti * 24 + 12
                lines += '<path class="schema-graph-line" d="'+routePath(x1, y1, endX, y2, si, totalW, tableList)+'" marker-end="url(#sg-arrow)"/>'
            }
        }

        container.innerHTML = '<div class="schema-graph-inner" id="schema-graph-inner" style="width:'+totalW+'px;height:'+totalH+'px">'
            +cards
            +'<svg class="schema-graph-svg" style="width:'+totalW+'px;height:'+totalH+'px">'
            +'<defs><marker id="sg-arrow" viewBox="0 0 12 8" refX="11" refY="4" markerWidth="10" markerHeight="7" orient="auto"><path d="M0 0 L11 4 L0 8" class="schema-graph-arrow"/></marker></defs>'
            +lines+'</svg></div>'
            +'<div class="schema-graph-zoom"><button class="schema-graph-zoom-btn" onclick="window.zoomSchemaGraph(-0.2)">−</button>'
            +'<span class="schema-graph-zoom-label" id="schema-zoom-label">100%</span>'
            +'<button class="schema-graph-zoom-btn" onclick="window.zoomSchemaGraph(0.2)">+</button>'
            +'<button class="schema-graph-zoom-btn" onclick="window.fitSchemaGraph()" title="Fit">⊡</button></div>'

        container.dataset.rendered = '1'
        setupSchemaGraphPanZoom(container, totalW, totalH)
    } catch(e) {
        container.innerHTML = '<div class="schema-graph-empty">Error: '+esc(e.message)+'</div>'
    }
}

function setupSchemaGraphPanZoom(container, totalW, totalH) {
    const inner = $('schema-graph-inner')
    if (!inner) return
    const rect = container.getBoundingClientRect()
    const s = Math.min((rect.width - 40) / totalW, (rect.height - 40) / totalH, 1.5)
    schemaZoom = Math.max(0.3, Math.min(s, 3))
    schemaPanX = Math.max(0, (rect.width - totalW * schemaZoom) / 2)
    schemaPanY = Math.max(0, (rect.height - totalH * schemaZoom) / 2)
    applySchemaTransform(inner)
    updateZoomLabel()

    let panning = false, sx, sy
    container.onmousedown = function(e) {
        if (e.target.closest('.schema-graph-zoom') || e.target.closest('.schema-graph-card')) return
        panning = true; sx = e.clientX - schemaPanX; sy = e.clientY - schemaPanY
        container.style.cursor = 'grabbing'; e.preventDefault()
    }
    container.onmousemove = function(e) {
        if (!panning) return
        schemaPanX = e.clientX - sx; schemaPanY = e.clientY - sy
        applySchemaTransform(inner)
    }
    container.onmouseup = container.onmouseleave = function() { panning = false; container.style.cursor = 'grab' }
    container.onwheel = function(e) {
        e.preventDefault()
        schemaZoom = Math.max(0.3, Math.min(schemaZoom + (e.deltaY > 0 ? -0.08 : 0.08), 3))
        applySchemaTransform(inner); updateZoomLabel()
    }
}

window.zoomSchemaGraph = function(delta) {
    const inner = $('schema-graph-inner')
    if (!inner) return
    schemaZoom = Math.max(0.3, Math.min(schemaZoom + delta, 3))
    applySchemaTransform(inner); updateZoomLabel()
}

window.fitSchemaGraph = function() {
    const container = $('schema-graph')
    const inner = $('schema-graph-inner')
    if (!inner) return
    const rect = container.getBoundingClientRect()
    const w = parseFloat(inner.style.width) || 800, h = parseFloat(inner.style.height) || 600
    schemaZoom = Math.max(0.3, Math.min((rect.width - 40) / w, (rect.height - 40) / h, 1.5))
    schemaPanX = Math.max(0, (rect.width - w * schemaZoom) / 2)
    schemaPanY = Math.max(0, (rect.height - h * schemaZoom) / 2)
    applySchemaTransform(inner); updateZoomLabel()
}

function applySchemaTransform(el) {
    el.style.transform = 'translate('+schemaPanX+'px,'+schemaPanY+'px) scale('+schemaZoom+')'
}

function updateZoomLabel() {
    const l = $('schema-zoom-label')
    if (l) l.textContent = Math.round(schemaZoom * 100) + '%'
}

// ── Beautify ────────────────────────────────────────

window.beautifySQL = function() {
    if (!editor) return
    const sql = editor.getValue()
    if (!sql.trim()) return
    try {
        const formatted = sqlFormatter.format(sql, { language: 'postgresql', keywordCase: 'upper', tabWidth: 4 })
        editor.setValue(formatted)
        showSaveIndicator('manual')
    } catch(e) {}
}

function duplicateLine(cm) {
    if (!cm) return
    const sel = cm.getSelection()
    if (sel) { cm.replaceSelection(sel + '\n' + sel); return }
    const cursor = cm.getCursor(), line = cm.getLine(cursor.line)
    cm.replaceRange('\n' + line, { line: cursor.line, ch: line.length })
    cm.setCursor(cursor.line + 1, cursor.ch)
}

// ── Reset / Checkpoint ──────────────────────────────

window.resetDB = async function() {
    if (!confirm('This will drop all tables in pgKata. All data will be lost. Continue?')) return
    setRC('<div class="execute-ok">Resetting database...</div>')
    try {
        await ensureDB()
        await pg.exec('DROP SCHEMA public CASCADE; CREATE SCHEMA public')
        setRC('<div class="execute-ok">Database recreated successfully</div>')
        loadSchema()
    } catch(e) {
        setRC(`<div class="error-msg">${esc(e.message)}</div>`)
    }
}

window.showRestore = function() {
    $('restore-overlay').style.display = 'flex'
    const all = buildChallengeList()
    const list = $('checkpoint-list')
    list.innerHTML = all.map(c => `
        <div class="checkpoint-item" onclick="window.confirmRestore('${c.id}')">
            <span class="checkpoint-id">${esc(c.id)}</span>
            <span class="checkpoint-title">${esc(c.title)}</span>
        </div>
    `).join('')
}

window.hideRestore = function() {
    $('restore-overlay').style.display = 'none'
}

window.confirmRestore = async function(checkpoint) {
    hideRestore()
    $('restore-progress-overlay').style.display = 'flex'
    const body = $('restore-progress-body')
    body.innerHTML = '<div class="restore-progress-item"><span class="restore-spinner"></span><span>Resetting database...</span></div>'

    try {
        const db = await ensureDB()

        const all = buildChallengeList()
        const idx = all.findIndex(c => c.id === checkpoint)
        if (idx === -1) throw new Error('Checkpoint not found')
        const target = all.slice(0, idx + 1)

        await db.exec('DROP SCHEMA public CASCADE; CREATE SCHEMA public')
        const progress = {}
        let failed = null

        for (const c of target) {
            const resp = await fetch('challenges/' + c.id + '/setup.sql')
            if (!resp.ok) {
                progress[c.id] = true
                continue
            }
            const setupSql = await resp.text()
            if (!setupSql.trim()) {
                progress[c.id] = true
                continue
            }
            try {
                await db.exec(setupSql)
                progress[c.id] = true
            } catch(e) {
                failed = { id: c.id, error: e.message }
                break
            }
        }

        saveProgress(progress)

        body.innerHTML = ''
        if (failed) {
            all.forEach(c => {
                const done = progress[c.id]
                const isFailed = c.id === failed.id
                const div = document.createElement('div')
                div.className = 'restore-progress-item'
                if (done) {
                    div.innerHTML = `<span class="restore-ok"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 8l3 3 5-6" stroke="#a6e22e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>${esc(c.id)} ${esc(c.title)}</span>`
                } else if (isFailed) {
                    div.innerHTML = `<span class="restore-fail"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="#ff297b" stroke-width="2" stroke-linecap="round"/></svg></span><span>${esc(c.id)} ${esc(c.title)}</span>`
                } else {
                    div.innerHTML = `<span class="restore-skip">&ndash;</span><span>${esc(c.id)} ${esc(c.title)}</span>`
                }
                body.appendChild(div)
            })
            const err = document.createElement('div')
            err.className = 'error-msg'
            err.style.marginTop = '12px'
            err.textContent = 'Failed at ' + failed.id + ': ' + failed.error
            body.appendChild(err)
            setTimeout(() => { $('restore-progress-overlay').style.display = 'none' }, 4000)
        } else {
            all.forEach(c => {
                if (progress[c.id]) {
                    const div = document.createElement('div')
                    div.className = 'restore-progress-item'
                    div.innerHTML = `<span class="restore-ok"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 8l3 3 5-6" stroke="#a6e22e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>${esc(c.id)} ${esc(c.title)}</span>`
                    body.appendChild(div)
                }
            })
            setTimeout(() => { $('restore-progress-overlay').style.display = 'none' }, 1500)
        }
        loadChallenges()
        if (currentFolder) saveSnapshot(currentFolder)
    } catch(e) {
        body.innerHTML = `<div class="error-msg">${esc(e.message)}</div>`
        setTimeout(() => { $('restore-progress-overlay').style.display = 'none' }, 3000)
    }
}

// ── Helpers ─────────────────────────────────────────

function esc(text) {
    if (text === null || text === undefined) return 'NULL'
    const div = document.createElement('div')
    div.textContent = String(text)
    return div.innerHTML
}

// ── Boot ────────────────────────────────────────────

;(async () => {
    await loadChallenges()
    sandboxMode = localStorage.getItem('pgkata_mode') === 'sandbox'
    updateModeUI()
    if (sandboxMode) {
        await enterSandbox()
    } else {
        const saved = localStorage.getItem('pgkata_current')
        if (saved) selectChallenge(saved)
    }
})()
</script>
