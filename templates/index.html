<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PostgreSQL Challenges</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/monokai.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/hint/show-hint.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-header">
  <h1>Level Up: PostgreSQL</h1>
  <div class="progress-bar-container">
    <span id="progress-label">0 / 0</span>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>
</div>

<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-header">Challenges</div>
    <div id="challenge-list"></div>
  </aside>

  <main class="main-panel">
    <div class="editor-section" id="editor-section">
      <div class="editor-header">
        <span id="file-label">Select a challenge from the sidebar</span>
        <div class="editor-actions">
          <button class="btn btn-primary" id="run-btn" disabled onclick="runSQL()">Run</button>
          <button class="btn btn-verify" id="verify-btn" disabled onclick="verifySQL()">Verify</button>
          <button class="btn btn-hint" id="hint-btn" disabled onclick="showHint()">Hint</button>
          <button class="btn btn-beautify" id="beautify-btn" onclick="beautifySQL()">Beautify</button>
          <button class="btn" id="restore-btn" onclick="showRestore()">Restore</button>
          <button class="btn btn-danger" id="reset-btn" onclick="resetDB()">Reset DB</button>
        </div>
      </div>
      <div class="editor-wrapper">
        <div id="challenge-desc" class="challenge-description" style="display:none"></div>
        <div id="empty-state" class="empty-state">Select a challenge to begin</div>
        <textarea id="editor" style="display:none"></textarea>
        <div class="editor-footer">
          <div class="indent-selector" id="indent-selector">
            <span class="indent-option" data-indent="2" onclick="setIndentUnit(2)">2</span>
            <span class="indent-option active" data-indent="4" onclick="setIndentUnit(4)">4</span>
            <span class="indent-option" data-indent="8" onclick="setIndentUnit(8)">8</span>
            <span class="indent-divider">|</span>
            <span class="indent-option" data-mode="spaces" onclick="setIndentMode('spaces')">Spaces</span>
            <span class="indent-option" data-mode="tabs" onclick="setIndentMode('tabs')">Tab</span>
          </div>
          <span id="save-indicator" class="save-indicator"></span>
        </div>
      </div>
    </div>
    <div class="split-handle" id="split-handle"></div>
    <div class="results-section" id="results-section">
      <div class="results-header">
        <span>Results</span>
        <span id="results-time"></span>
      </div>
      <div class="psql-bar">
        <span class="psql-prompt">=#</span>
        <input type="text" class="psql-input" id="psql-input" placeholder="Type a command..." list="psql-commands" autocomplete="off" onkeydown="if(event.key==='Enter')runPsql()" />
        <datalist id="psql-commands">
          <option value="\dt">
          <option value="\d">
          <option value="\d+">
          <option value="\di">
          <option value="\dv">
          <option value="\df">
          <option value="\du">
          <option value="\l">
          <option value="\dn">
          <option value="\x">
          <option value="\conninfo">
          <option value="\?">
        </datalist>
        <button class="btn psql-btn" onclick="runPsql()">Run</button>
      </div>
      <div id="verify-result" style="display:none"></div>
      <div id="hint-content" class="hint-container" style="display:none"></div>
      <div class="results-content" id="results-content"></div>
    </div>
  </main>
</div>

<div id="restore-overlay" class="overlay" style="display:none">
  <div class="overlay-content">
    <div class="overlay-header">
      <span>Restore to checkpoint</span>
      <span class="overlay-close" onclick="hideRestore()">&times;</span>
    </div>
    <div class="overlay-body">
      <p class="overlay-desc">Reset the database and run all challenges up to the selected checkpoint.</p>
      <div id="checkpoint-list"></div>
    </div>
    <div class="overlay-footer">
      <button class="btn" onclick="hideRestore()">Cancel</button>
    </div>
  </div>
</div>

<div id="restore-progress-overlay" class="overlay" style="display:none">
  <div class="overlay-content">
    <div class="overlay-header">
      <span>Restoring...</span>
    </div>
    <div class="overlay-body" id="restore-progress-body">
      <div class="restore-progress-item" id="restore-status-reset">
        <span class="restore-spinner"></span>
        <span>Resetting database...</span>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/hint/show-hint.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/hint/sql-hint.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/closebrackets.js"></script>
<script>
let editor = null;
let currentFolder = null;
let currentFiles = {};
let currentInfo = {};
let challengeData = [];
let tiers = [];
let tierProgress = {};
let hintLevel = 0;
let autosaveTimer = null;
let splitDragging = false;

function initSplitPane() {
  const handle = $('split-handle');
  const results = $('results-section');
  const panel = document.querySelector('.main-panel');

  function loadSplit() {
    try {
      const val = localStorage.getItem('sql_split_pct');
      return val ? parseFloat(val) : 0.35;
    } catch(e) { return 0.35; }
  }

  function applySplit(pct) {
    const panelHeight = panel.clientHeight;
    const handleH = handle.clientHeight;
    const resultsH = Math.max(60, Math.round(panelHeight * pct));
    const editorH = panelHeight - resultsH - handleH;
    const editorSection = document.querySelector('.editor-section');
    if (editorSection) editorSection.style.flex = 'none';
    if (editorSection) editorSection.style.height = Math.max(50, editorH) + 'px';
    results.style.height = resultsH + 'px';
    results.style.flex = 'none';
  }

  function onDown(e) {
    splitDragging = true;
    handle.classList.add('active');
    e.preventDefault();
  }

  function onMove(e) {
    if (!splitDragging) return;
    const rect = panel.getBoundingClientRect();
    const y = (e.clientY || e.touches[0].clientY) - rect.top;
    const pct = Math.max(0.08, Math.min(0.7, (rect.height - y) / rect.height));
    applySplit(pct);
    try { localStorage.setItem('sql_split_pct', pct); } catch(e) {}
  }

  function onUp() {
    if (!splitDragging) return;
    splitDragging = false;
    handle.classList.remove('active');
  }

  handle.addEventListener('mousedown', onDown);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  handle.addEventListener('touchstart', onDown);
  document.addEventListener('touchmove', onMove);
  document.addEventListener('touchend', onUp);

  setTimeout(() => applySplit(loadSplit()), 50);
  window.addEventListener('resize', () => applySplit(loadSplit()));
}

function $(id) { return document.getElementById(id); }

function loadIndentPref() {
  try {
    const raw = localStorage.getItem('sql_indent_pref');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { size: 4, mode: 'spaces' };
}

function saveIndentPref(pref) {
  try {
    localStorage.setItem('sql_indent_pref', JSON.stringify(pref));
  } catch(e) {}
}

function updateIndentSelector(pref) {
  document.querySelectorAll('.indent-option').forEach(el => {
    el.classList.remove('active');
  });
  const sizeEl = document.querySelector(`.indent-option[data-indent="${pref.size}"]`);
  if (sizeEl) sizeEl.classList.add('active');
  const modeEl = document.querySelector(`.indent-option[data-mode="${pref.mode}"]`);
  if (modeEl) modeEl.classList.add('active');
}

function setIndentUnit(size) {
  if (!editor) return;
  const pref = loadIndentPref();
  pref.size = parseInt(size);
  pref.mode = editor.getOption('indentWithTabs') ? 'tabs' : 'spaces';
  saveIndentPref(pref);
  editor.setOption('indentUnit', pref.size);
  if (!editor.getOption('indentWithTabs')) {
    editor.setOption('tabSize', pref.size);
  }
  updateIndentSelector(pref);
}

function setIndentMode(mode) {
  if (!editor) return;
  const pref = loadIndentPref();
  pref.mode = mode;
  if (mode === 'tabs') {
    editor.setOption('indentWithTabs', true);
    editor.setOption('indentUnit', pref.size);
    editor.setOption('tabSize', pref.size);
  } else {
    editor.setOption('indentWithTabs', false);
    editor.setOption('indentUnit', pref.size);
    editor.setOption('tabSize', pref.size);
  }
  saveIndentPref(pref);
  updateIndentSelector(pref);
}

function showSaveIndicator(type) {
  const el = $('save-indicator');
  if (!el) return;
  if (type === 'manual') {
    el.className = 'save-indicator save-manual';
    el.textContent = 'Saved';
  } else {
    el.className = 'save-indicator save-auto';
    el.textContent = 'Auto-saved';
  }
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 2000);
}

function saveEditorContent() {
  if (!editor || !currentFolder) return;
  const content = editor.getValue();
  try {
    localStorage.setItem('sql_editor_' + currentFolder, content);
  } catch(e) {}
}

function loadEditorContent(folder) {
  try {
    return localStorage.getItem('sql_editor_' + folder);
  } catch(e) {
    return null;
  }
}

function clearEditorContent(folder) {
  try {
    localStorage.removeItem('sql_editor_' + folder);
  } catch(e) {}
}

function startAutosave() {
  stopAutosave();
  autosaveTimer = setInterval(() => {
    saveEditorContent();
    showSaveIndicator('auto');
  }, 30000);
}

function stopAutosave() {
  if (autosaveTimer) {
    clearInterval(autosaveTimer);
    autosaveTimer = null;
  }
}

async function fetchJSON(url, opts) {
  const r = await fetch(url, opts);
  return r.json();
}

async function loadChallenges() {
  const data = await fetchJSON('/api/challenges');
  challengeData = data.challenges;
  tiers = data.tiers || [];
  tierProgress = data.tier_progress || {};
  renderSidebar(data.challenges, data.progress, data.completed, data.total, data.tiers, data.tier_progress);
}

function renderSidebar(challenges, progress, completed, total, tiers, tp) {
  const list = $('challenge-list');
  list.innerHTML = '';

  if (tiers) {
    tiers.forEach(tier => {
      const tpd = tp ? tp[tier.label] : null;
      const seg = document.createElement('div');
      seg.className = 'tier-section';
      seg.innerHTML = `<div class="tier-header"><span class="tier-label">${tier.label}</span>${tpd ? `<span class="tier-count">${tpd.completed}/${tpd.total}</span>` : ''}</div>`;
      const inner = document.createElement('div');
      inner.className = 'tier-challenges';
      tier.dirs.forEach(dir => {
        const fullId = tier.id + '/' + dir;
        const c = challenges.find(x => x.id === fullId);
        if (!c) return;
        const done = progress[c.id] === true;
        const diff = c.difficulty || 'medium';
        const diffColors = {easy: '#a6e22e', medium: '#e6db74', hard: '#ff297b', expert: '#66d9ef'};
        const diffColor = diffColors[diff] || '#9a957c';
        const div = document.createElement('div');
        div.className = 'challenge-item' + (done ? ' completed' : '');
        div.dataset.folder = c.id;
        div.onclick = () => selectChallenge(c.id);
        div.innerHTML = `
          <span class="challenge-status">${done ? '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#a6e22e" stroke-width="1.5"/><path d="M5 8l2 2 4-4" stroke="#a6e22e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#3e3d32" stroke-width="1.5"/></svg>'}</span>
          <span class="challenge-diff"><svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="${diffColor}"/></svg></span>
          <span class="challenge-title">${c.title}</span>
        `;
        inner.appendChild(div);
      });
      seg.appendChild(inner);
      list.appendChild(seg);
    });
  } else {
    challenges.forEach(c => {
      const done = progress[c.id] === true;
      const div = document.createElement('div');
      div.className = 'challenge-item' + (done ? ' completed' : '');
      div.dataset.folder = c.id;
      div.onclick = () => selectChallenge(c.id);
      div.innerHTML = `
        <span class="challenge-status">${done ? '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#a6e22e" stroke-width="1.5"/><path d="M5 8l2 2 4-4" stroke="#a6e22e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#3e3d32" stroke-width="1.5"/></svg>'}</span>
        <span class="challenge-title">${c.title}</span>
      `;
      list.appendChild(div);
    });
  }
  updateProgress(completed, total);
}

function updateProgress(completed, total) {
  const pct = total ? Math.round(completed / total * 100) : 0;
  $('progress-label').textContent = `${completed} / ${total}`;
  $('progress-fill').style.width = pct + '%';
}

async function markComplete(folder) {
  const data = await fetchJSON('/api/progress');
  data[folder] = true;
  await fetchJSON('/api/progress', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data),
  });
  loadChallenges();
}

function selectChallenge(folder) {
  saveEditorContent();
  stopAutosave();
  document.querySelectorAll('.challenge-item').forEach(el => {
    el.classList.toggle('active', el.dataset.folder === folder);
  });
  currentFolder = folder;
  $('run-btn').disabled = false;
  $('verify-btn').disabled = false;
  $('hint-btn').disabled = false;
  hintLevel = 0;
  $('hint-content').style.display = 'none';
  loadFolder(folder);
}

function loadFolder(folder) {
  fetchJSON(`/api/challenges/${folder}`).then(data => {
    currentFiles = data.files || {};
    currentInfo = data.info || {};
    const fileCount = Object.keys(currentFiles).length;
    const desc = currentInfo.description || '';
    const label = fileCount > 1 ? `${folder} (${fileCount} files)` : `${folder}`;
    $('file-label').textContent = label;
    $('challenge-desc').textContent = desc;
    $('challenge-desc').style.display = desc ? 'block' : 'none';
    $('empty-state').style.display = 'none';
    const ta = $('editor');
    if (!editor) {
      ta.style.display = 'none';
      const savedIndent = loadIndentPref();
      editor = CodeMirror.fromTextArea(ta, {
        mode: 'text/x-pgsql',
        theme: 'monokai',
        lineNumbers: true,
        indentWithTabs: savedIndent.mode === 'tabs',
        indentUnit: savedIndent.size,
        tabSize: savedIndent.mode === 'tabs' ? savedIndent.size : 4,
        smartIndent: true,
        lineWrapping: true,
        autoCloseBrackets: true,
        extraKeys: {
          'Ctrl-Enter': runSQL,
          'Cmd-Enter': runSQL,
          'Ctrl-S': function() { saveEditorContent(); showSaveIndicator('manual'); },
          'Cmd-S': function() { saveEditorContent(); showSaveIndicator('manual'); },
          'Shift-Alt-Down': function(cm) { duplicateLine(cm); },
          'Cmd-Shift-D': function(cm) { duplicateLine(cm); },
          'Enter': function(cm) {
            const cur = cm.getCursor();
            const line = cm.getLine(cur.line);
            const ch = cur.ch;
            if (ch > 0 && ch < line.length) {
              const before = line[ch - 1];
              const after = line[ch];
              if ((before === '{' && after === '}') || (before === '(' && after === ')')) {
                const indent = /^\s*/.exec(line)[0];
                const unit = cm.getOption('indentUnit');
                const tab = cm.getOption('indentWithTabs') ? '\t' : ' ';
                const inner = indent + tab.repeat(unit > 0 ? 1 : unit);
                cm.replaceRange('\n' + inner + '\n' + indent, cur);
                cm.setCursor(cur.line + 1, inner.length);
                return;
              }
            }
            return cm.execCommand('newlineAndIndent');
          },
        },
        hintOptions: { completeSingle: false },
      });
      editor.on('inputRead', function(cm, change) {
        if (change.text.length === 1 && /\w/.test(change.text[0]) && !cm.state.completionActive) {
          cm.showHint({ hint: CodeMirror.hint.sql });
        }
      });
      editor.on('changes', function() { startAutosave(); });
      updateIndentSelector(loadIndentPref());
      loadSchema();
    }

function loadSchema() {
  fetchJSON('/api/schema').then(data => {
    if (!data.schema) return;
    const tables = {};
    Object.entries(data.schema).forEach(([name, cols]) => {
      tables[name] = cols.map(c => c.column);
    });
    if (editor) {
      editor.setOption('hintOptions', { tables: tables, completeSingle: false });
    }
  }).catch(() => {});
}
    const saved = loadEditorContent(folder);
    editor.setValue(saved || '-- Write your SQL here\n');
    editor.refresh();
    startAutosave();
    $('results-content').innerHTML = '';
    $('hint-content').style.display = 'none';
    $('hint-content').innerHTML = '';
    $('verify-result').style.display = 'none';
  });
}

async function runSQL() {
  if (!editor) return;
  saveEditorContent();
  const sql = editor.getValue();
  if (!sql.trim()) return;

  const btn = $('run-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span>';
  $('results-section').style.display = 'block';
  $('results-content').innerHTML = '';
  $('verify-result').style.display = 'none';

  const startTime = performance.now();
  const data = await fetchJSON('/api/run', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({sql}),
  });
  const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
  $('results-time').textContent = `${elapsed}s`;

  btn.disabled = false;
  btn.textContent = 'Run';

  const container = $('results-content');

  if (data.error) {
    container.innerHTML = `<div class="error-msg">${escapeHtml(data.error)}</div>`;
    return;
  }

  if (!data.results || data.results.length === 0) {
    container.innerHTML = '<div class="execute-ok">No results</div>';
    return;
  }

  let hasError = false;
  data.results.forEach(r => {
    if (r.type === 'select') {
      const block = document.createElement('div');
      block.className = 'result-block';
      block.innerHTML = `
        <div class="result-label">SELECT (${r.row_count} rows)</div>
        <table class="result-table">
          <thead><tr>${r.columns.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>
          <tbody>${r.rows.map(row => `<tr>${row.map(c => `<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>`;
      container.appendChild(block);
    } else if (r.type === 'execute') {
      const block = document.createElement('div');
      block.className = 'result-block';
      const msg = r.rows_affected !== null && r.rows_affected !== undefined
        ? `${r.rows_affected} row(s) affected`
        : 'Query executed successfully';
      block.innerHTML = `<div class="execute-ok">${msg}</div>`;
      container.appendChild(block);
    } else if (r.type === 'error') {
      hasError = true;
      const block = document.createElement('div');
      block.className = 'result-block';
      block.innerHTML = `<div class="error-msg">${escapeHtml(r.error)}</div>`;
      container.appendChild(block);
    }
  });

  if (!hasError && currentFolder) {
    loadSchema();
  }
}

async function runPsql() {
  const input = $('psql-input');
  if (!input) return;
  const cmd = input.value.trim();
  if (!cmd) return;

  $('results-section').style.display = 'block';
  const container = $('results-content');

  const data = await fetchJSON('/api/psql', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({command: cmd}),
  });

  if (data.text) {
    container.innerHTML = `<div class="psql-result-text">${escapeHtml(data.text)}</div>`;
    return;
  }

  if (data.error) {
    container.innerHTML = `<div class="error-msg">${escapeHtml(data.error)}</div>`;
    return;
  }

  if (data.columns && data.columns.length > 0) {
    const container = $('results-content');
    container.innerHTML = '';
    if (data.expanded) {
      data.rows.forEach((row, i) => {
        const rec = document.createElement('div');
        rec.className = 'expanded-record';
        rec.innerHTML = `<div class="expanded-header">-[ RECORD ${i + 1} ]--</div>` +
          row.map((val, j) =>
            `<div class="expanded-row"><span class="expanded-field">${escapeHtml(data.columns[j])}</span><span class="expanded-val">${escapeHtml(val || '')}</span></div>`
          ).join('');
        container.appendChild(rec);
      });
    } else {
      const block = document.createElement('div');
      block.className = 'result-block';
      block.innerHTML = `
        <div class="result-label">${data.label || 'psql output'} (${data.rows.length} rows)</div>
        <table class="result-table">
          <thead><tr>${data.columns.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>
          <tbody>${data.rows.map(row => `<tr>${row.map(c => `<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>`;
      container.appendChild(block);
    }
    if (data.constraints && data.constraints.length > 0) {
      const constBlock = document.createElement('div');
      constBlock.className = 'result-block';
      constBlock.innerHTML = `
        <div class="result-label">Constraints (${data.constraints.length})</div>
        <table class="result-table">
          <thead><tr><th>Constraint</th><th>Type</th><th>Column(s)</th></tr></thead>
          <tbody>${data.constraints.map(row => `<tr>${row.map(c => `<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>`;
      container.appendChild(constBlock);
    }
    return;
  }

  container.innerHTML = `<div class="execute-ok">${escapeHtml(data.message || 'Done')}</div>`;
}

async function verifySQL() {
  if (!editor || !currentFolder) return;
  saveEditorContent();
  const userSql = editor.getValue().trim();
  if (!userSql) return;

  const btn = $('verify-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span>';
  $('results-section').style.display = 'block';
  $('results-content').innerHTML = '';
  $('verify-result').style.display = 'none';

  const data = await fetchJSON('/api/verify', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({challenge_id: currentFolder, user_sql: userSql}),
  });

  btn.disabled = false;
  btn.textContent = 'Verify';

  const vr = $('verify-result');
  vr.style.display = 'block';

  if (data.error) {
    vr.className = 'verify-result verify-fail';
    vr.innerHTML = `<span class="verify-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#ff297b" stroke-width="1.5"/><path d="M5 5l6 6M11 5l-6 6" stroke="#ff297b" stroke-width="1.5" stroke-linecap="round"/></svg></span><span>Error: ${escapeHtml(data.error)}</span>`;
    return;
  }

  if (data.passed) {
    vr.className = 'verify-result verify-pass';
    vr.innerHTML = `<span class="verify-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#a6e22e" stroke-width="1.5"/><path d="M5 8l2 2 4-4" stroke="#a6e22e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>${escapeHtml(data.message)}</span>`;
    markComplete(currentFolder);
    loadSchema();
  } else {
    vr.className = 'verify-result verify-fail';
    vr.innerHTML = `<span class="verify-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#ff297b" stroke-width="1.5"/><path d="M5 5l6 6M11 5l-6 6" stroke="#ff297b" stroke-width="1.5" stroke-linecap="round"/></svg></span><span>${escapeHtml(data.message)}</span>`;
    if (data.expected && data.actual) {
      const container = $('results-content');
      const diff = document.createElement('div');
      diff.className = 'diff-panel';
      diff.innerHTML = `
        <div class="diff-section">
          <div class="diff-header">Expected</div>
          <pre class="diff-content">${escapeHtml(JSON.stringify(data.expected, null, 2))}</pre>
        </div>
        <div class="diff-section">
          <div class="diff-header">Actual</div>
          <pre class="diff-content">${escapeHtml(JSON.stringify(data.actual, null, 2))}</pre>
        </div>
      `;
      container.appendChild(diff);
    }
  }
}

async function showHint() {
  if (!currentFolder) return;
  const data = await fetchJSON('/api/hint', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({challenge_id: currentFolder, level: hintLevel}),
  });
  if (data.error) return;
  const hc = $('hint-content');
  hc.style.display = 'block';
  if (data.hint === null) {
    if (data.total === 0) {
      const item = document.createElement('div');
      item.className = 'hint-item';
      item.innerHTML = `<span class="hint-label">No hints available</span>`;
      hc.appendChild(item);
    }
    $('hint-btn').disabled = true;
    return;
  }
  const item = document.createElement('div');
  item.className = 'hint-item';
  item.innerHTML = `<span class="hint-label">Hint ${hintLevel + 1}/${data.total}</span><span>${escapeHtml(data.hint)}</span>`;
  hc.appendChild(item);
  hintLevel++;
  if (hintLevel >= data.total) {
    $('hint-btn').disabled = true;
  }
}

async function resetDB() {
  if (!confirm('This will drop and recreate the levelup database. All data will be lost. Continue?')) return;
  await fetchJSON('/api/reset', {method: 'POST'});
  $('results-section').style.display = 'block';
  $('results-content').innerHTML = '<div class="execute-ok">Database recreated successfully</div>';
  loadSchema();
}

function beautifySQL() {
  if (!editor) return;
  const unit = editor.getOption('indentUnit');
  const useTabs = editor.getOption('indentWithTabs');
  const indentChar = useTabs ? '\t' : ' ';
  for (let i = 0; i < editor.lineCount(); i++) {
    editor.indentLine(i, 'smart');
  }
  showSaveIndicator('manual');
}

function duplicateLine(cm) {
  if (!cm) return;
  const sel = cm.getSelection();
  if (sel) {
    cm.replaceSelection(sel + '\n' + sel);
    return;
  }
  const cursor = cm.getCursor();
  const line = cm.getLine(cursor.line);
  const pos = { line: cursor.line, ch: line.length };
  cm.replaceRange('\n' + line, pos);
  cm.setCursor(cursor.line + 1, cursor.ch);
}

function showRestore() {
  $('restore-overlay').style.display = 'flex';
  const list = $('checkpoint-list');
  list.innerHTML = challengeData.map(c => `
    <div class="checkpoint-item" onclick="confirmRestore('${c.id}')">
      <span class="checkpoint-id">${c.id}</span>
      <span class="checkpoint-title">${c.title}</span>
    </div>
  `).join('');
}

function hideRestore() {
  $('restore-overlay').style.display = 'none';
}

async function confirmRestore(checkpoint) {
  hideRestore();
  $('restore-progress-overlay').style.display = 'flex';
  const body = $('restore-progress-body');
  body.innerHTML = '<div class="restore-progress-item"><span class="restore-spinner"></span><span>Resetting database...</span></div>';

  const data = await fetchJSON('/api/checkpoint', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({checkpoint}),
  });

  body.innerHTML = '';

  if (data.error) {
    body.innerHTML = `<div class="error-msg">${escapeHtml(data.error)}</div>`;
    setTimeout(() => { $('restore-progress-overlay').style.display = 'none'; }, 2000);
    return;
  }

  if (data.failed_at) {
    const failedIdx = challengeData.findIndex(c => c.id === data.failed_at);
    challengeData.forEach((c, i) => {
      const done = data.progress[c.id] === true;
      const isFailed = c.id === data.failed_at;
      const div = document.createElement('div');
      div.className = 'restore-progress-item';
      if (done) {
        div.innerHTML = '<span class="restore-ok"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 8l3 3 5-6" stroke="#a6e22e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>' + c.id + ' ' + c.title + '</span>';
      } else if (isFailed) {
        div.innerHTML = '<span class="restore-fail"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="#ff297b" stroke-width="2" stroke-linecap="round"/></svg></span><span>' + c.id + ' ' + c.title + '</span>';
      } else {
        div.innerHTML = '<span class="restore-skip">&ndash;</span><span>' + c.id + ' ' + c.title + '</span>';
      }
      body.appendChild(div);
    });
    const err = document.createElement('div');
    err.className = 'error-msg';
    err.style.marginTop = '12px';
    err.textContent = 'Failed at ' + data.failed_at + ': ' + data.error;
    body.appendChild(err);
    setTimeout(() => { $('restore-progress-overlay').style.display = 'none'; }, 4000);
  } else {
    challengeData.forEach((c, i) => {
      const done = data.progress[c.id] === true;
      const div = document.createElement('div');
      div.className = 'restore-progress-item';
      if (done) {
        div.innerHTML = '<span class="restore-ok"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 8l3 3 5-6" stroke="#a6e22e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>' + c.id + ' ' + c.title + '</span>';
      }
      body.appendChild(div);
    });
    setTimeout(() => { $('restore-progress-overlay').style.display = 'none'; }, 1500);
  }

  loadChallenges();
}

function escapeHtml(text) {
  if (text === null || text === undefined) return 'NULL';
  const div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML;
}

initSplitPane();
loadChallenges();
</script>
